<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>After TV</title>
    <meta name="description" content="VJ Rien Live 24/7" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="canonical" href="https://odcstudio.fr/after-tv/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="After TV" />
    <meta property="og:title" content="After TV" />
    <meta property="og:description" content="VJ Rien Live 24/7" />
    <meta property="og:url" content="https://odcstudio.fr/after-tv/" />
    <meta property="og:image" content="https://odcstudio.fr/after-tv/og.png?v=2" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:alt" content="AFTER TV in white on a black screen" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="After TV" />
    <meta name="twitter:description" content="VJ Rien Live 24/7" />
    <meta name="twitter:image" content="https://odcstudio.fr/after-tv/og.png?v=2" />

    <script type="importmap">
      {
        "imports": {
          "@mediapipe/tasks-audio": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-audio@1.2.3/+esm"
        }
      }
    </script>
    <style>
      :root {
        --fond: #000;
        --texte: #e8e8e6;
        --doux: #9a9a96;
        --accent: #ff4d2e;
        --panneau: rgba(10, 10, 12, 0.78);
        --bord: rgba(255, 255, 255, 0.12);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--fond);
        color: var(--texte);
        font:
          13px/1.45 ui-sans-serif,
          system-ui,
          sans-serif;
        overflow: hidden;
      }
      #ecran {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #000;
      }
      #console {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 10;
        width: min(360px, calc(100vw - 24px));
        max-height: calc(100vh - 24px);
        overflow-y: auto;
        box-sizing: border-box;
        padding: 10px 12px;
        background: var(--panneau);
        border: 1px solid var(--bord);
        border-radius: 10px;
        backdrop-filter: blur(6px);
      }
      #console.replie > :not(.tete) {
        display: none;
      }
      .tete {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .tete h1 {
        font-size: 12px;
        font-weight: 600;
        margin: 0;
        color: var(--doux);
        flex: 1;
      }
      .commandes {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 8px 0;
      }
      select,
      input,
      button {
        font: inherit;
        background: #1a1a1c;
        color: var(--texte);
        border: 1px solid #2c2c2f;
        border-radius: 6px;
        padding: 4px 8px;
        max-width: 100%;
      }
      button {
        cursor: pointer;
      }
      #go {
        background: var(--accent);
        border-color: var(--accent);
        color: #000;
        font-weight: 600;
      }
      #replier {
        padding: 0 8px;
      }
      #partie {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.01em;
        margin: 4px 0 0;
      }
      #drop {
        font-weight: 600;
        color: var(--accent);
        min-height: 1.2em;
        margin: 0;
      }
      p {
        margin: 2px 0;
      }
      .doux {
        color: var(--doux);
      }
      #loops {
        margin: 6px 0 0;
        padding: 0;
        list-style: none;
      }
      #demarrer {
        position: fixed;
        inset: 0;
        z-index: 5;
        display: grid;
        place-items: center;
        width: 100%;
        border: 0;
        border-radius: 0;
        background: rgba(0, 0, 0, 0.45);
        color: var(--texte);
        font-size: 20px;
        font-weight: 600;
        cursor: pointer;
      }
      #demarrer[hidden] {
        display: none;
      }
      #journal {
        list-style: none;
        padding: 0;
        margin: 6px 0 0;
        font:
          11px/1.5 ui-monospace,
          monospace;
        color: var(--doux);
        max-height: 18vh;
        overflow-y: auto;
      }
      #credit {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: flex-end;
        max-width: calc(100vw - 24px);
        font:
          12px/1.4 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        color: rgba(242, 242, 242, 0.7);
        background: rgba(0, 0, 0, 0.45);
        padding: 5px 10px;
        border-radius: 999px;
      }
      #credit a {
        color: #f2f2f2;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      #credit a:hover {
        text-decoration: underline;
      }
      #credit svg {
        flex: none;
      }
      @media (max-width: 720px) {
        #credit {
          top: 56px;
        }
      }
    </style>
  </head>
  <body>
    <div id="credit">
      a project by
      <a href="https://www.instagram.com/vj_rien_/" target="_blank" rel="noopener"
        ><svg
          viewBox="0 0 24 24"
          width="14"
          height="14"
          aria-hidden="true"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect x="3" y="3" width="18" height="18" rx="5" />
          <circle cx="12" cy="12" r="4" />
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" /></svg
        >@vj_rien_</a
      >
      and
      <a href="https://www.instagram.com/enjoy.dot/" target="_blank" rel="noopener"
        ><svg
          viewBox="0 0 24 24"
          width="14"
          height="14"
          aria-hidden="true"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect x="3" y="3" width="18" height="18" rx="5" />
          <circle cx="12" cy="12" r="4" />
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" /></svg
        >@enjoy.dot</a
      >
    </div>
    <iframe id="ecran" title="After TV" allow="autoplay; fullscreen"></iframe>
    <button id="demarrer" type="button">Écouter le son de l'ordinateur</button>
    <section id="console" aria-label="Console de l'oreille">
      <div class="tete">
        <h1>After TV autonome · oreille et montage dans la page</h1>
        <button id="replier" title="Replier la console">–</button>
      </div>
      <div class="commandes">
        <select id="source">
          <option value="url">Morceau de test</option>
          <option value="display">Son d'un onglet ou du système</option>
          <option value="device">Entrée audio</option>
          <option value="file">Fichier</option>
          <option value="test">Signal de test 124 BPM</option>
        </select>
        <select id="morceau">
          <option>Ontal &amp; 2nd Gen - Shock.mp3</option>
          <option>Jonny Poole - Vortex.mp3</option>
          <option>Oran Loyfer - Puppys Anthem.mp3</option>
          <option>Russo - Hidden Side.mp3</option>
          <option>ur tarx.mp3</option>
        </select>
        <input id="fichier" type="file" accept="audio/*" hidden />
        <button id="go">Écouter</button>
        <button id="moitie" title="Tempo divisé par deux">÷2</button>
        <button id="double" title="Tempo multiplié par deux">×2</button>
        <button id="un" title="Cliquer quand on entend le premier temps de la mesure">Tap 1</button>
      </div>
      <p>
        <span id="etat" class="doux">Chargement…</span> ·
        <span id="bpm" class="doux">tempo : pas encore</span>
      </p>
      <p id="genre" class="doux">genre : pas encore</p>
      <p id="partie">—</p>
      <p id="raison" class="doux"></p>
      <p id="drop"></p>
      <p id="phrase"></p>
      <p id="revient"></p>
      <p id="mesure" class="doux"></p>
      <p id="mode"></p>
      <ul id="loops" class="doux"></ul>
      <p id="niveaux" class="doux"></p>
      <ul id="journal"></ul>
    </section>
    <script type="module" src="oreille.js"></script>
  </body>
</html>
