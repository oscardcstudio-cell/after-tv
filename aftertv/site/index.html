    <link rel="stylesheet" href="interface.css" />
    <style>
      :root {
        --fond: #000;
        --texte: #f2f2f2;
        --discret: rgba(242, 242, 242, 0.55);
        --drop: #3ddc84;
        --break: #ff9f45;
        --suspension: #6c9cff;
        --hyper: #ff4d9d;
        --one_shot: #f2f2f2;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--fond);
        color: var(--texte);
        font:
          14px/1.4 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        overflow: hidden;
      }
      video,
      .vignette {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: var(--fond);
      }
      video {
        opacity: 0;
      }
      video.visible {
        opacity: 1;
      }
      .vignette {
        background-size: cover;
        background-position: center;
      }
      #bandeau {
        position: fixed;
        z-index: 1000;
        left: 16px;
        right: 16px;
        bottom: 16px;
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        transition: opacity 0.6s;
      }
      body.calme #bandeau {
        opacity: 0;
      }
      #bandeau button {
        font: inherit;
        color: var(--texte);
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid var(--discret);
        border-radius: 999px;
        padding: 6px 14px;
        cursor: pointer;
      }
      #bandeau button[aria-pressed='true'] {
        background: var(--texte);
        color: #000;
      }
      #titre {
        color: var(--discret);
        margin-left: auto;
        text-align: right;
      }
      #depart {
        position: fixed;
        z-index: 999;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 22px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      #depart[hidden] {
        display: none;
      }
      body.silence #depart,
      body.silence #depart[hidden] {
        display: grid;
        background: #000;
        animation: fondu-noir 1.5s ease-in both;
      }
      @keyframes fondu-noir {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      body.silence #miroir,
      body.silence #vignette {
        visibility: hidden;
      }
      body.trou #miroir,
      body.trou #vignette {
        visibility: hidden;
      }
      body.silence #debug[hidden] ~ #indicateurs {
        visibility: hidden;
      }
      #miroir .couche {
        position: fixed;
        inset: 0;
        transition: filter 120ms linear;
      }
      #miroir video {
        transition: none;
      }
      #vhs {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 19;
        pointer-events: none;
      }
      body.silence #vhs,
      body.trou #vhs {
        visibility: hidden;
      }
      #trails {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 18;
        pointer-events: none;
        opacity: 0;
        transition: opacity 700ms ease;
      }
      #trails.on {
        opacity: 1;
      }
      body.silence #trails,
      body.trou #trails {
        visibility: hidden;
      }
      #ecoute {
        display: none;
      }
      body.pilote #ecoute:not(:empty),
      body.debug #ecoute:not(:empty) {
        display: inline;
      }
      #indicateurs #avance {
        display: none;
        align-items: center;
        gap: 8px;
        font-variant-numeric: tabular-nums;
      }
      body.pilote #indicateurs #avance.la,
      body.debug #indicateurs #avance.la {
        display: inline-flex;
      }
      #avance .rail {
        width: 110px;
        height: 4px;
        border-radius: 2px;
        background: rgba(242, 242, 242, 0.25);
        overflow: hidden;
      }
      #avance .rail i {
        display: block;
        height: 100%;
        background: var(--texte);
      }
      #avance.fin .rail i {
        background: #ff9f45;
      }
      #indicateurs {
        position: fixed;
        z-index: 1000;
        top: 16px;
        left: 16px;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      #indicateurs span {
        background: rgba(0, 0, 0, 0.6);
        border-radius: 6px;
        padding: 5px 10px;
      }
      body.debug #indicateurs {
        right: calc(min(520px, 100% - 32px) + 32px);
      }
      @media (max-width: 760px) {
        body.debug #indicateurs {
          right: 16px;
        }
      }
      #indicateurs .voyant {
        display: none;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        letter-spacing: 0.08em;
      }
      body.kicks #indicateurs .voyant {
        display: inline-flex;
      }
      #indicateurs #paire,
      body.kicks #indicateurs #paire {
        display: none;
      }
      body.debug #indicateurs #paire {
        display: inline-flex;
      }
      #indicateurs #paire.on {
        color: #ff9f45;
      }
      #indicateurs #paire.on i {
        background: #ff9f45;
        box-shadow: 0 0 14px 5px rgba(255, 159, 69, 0.8);
        transform: scale(1.5);
      }
      #indicateurs .voyant i {
        display: block;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: rgba(242, 242, 242, 0.18);
        transition:
          background 0.18s,
          box-shadow 0.18s,
          transform 0.18s;
      }
      #indicateurs .voyant.bat i {
        background: #fff;
        box-shadow: 0 0 14px 5px rgba(255, 255, 255, 0.9);
        transform: scale(1.5);
        transition: none;
      }
      #mode {
        color: #000;
      }
      #mode:empty,
      #style:empty,
      #tempo:empty {
        display: none;
      }
      #endirect {
        display: none;
        color: #ff4d4d;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      body.direct #endirect {
        display: inline;
      }
      #debug {
        --ok: #6c9cff;
        --alerte: #ff9f45;
        --trait: rgba(242, 242, 242, 0.16);
        position: fixed;
        z-index: 1001;
        top: 56px;
        right: 16px;
        width: min(520px, calc(100% - 32px));
        container-type: inline-size;
        max-height: calc(100% - 140px);
        overflow: auto;
        overscroll-behavior: contain;
        box-sizing: border-box;
        background: rgba(8, 10, 16, 0.88);
        border: 1px solid var(--trait);
        border-radius: 8px;
        padding: 12px;
        font:
          13px/1.4 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      #debug[hidden] {
        display: none;
      }
      #debug section {
        margin: 0 0 14px;
      }
      #debug section:last-child {
        margin-bottom: 0;
      }
      #debug h3 {
        margin: 0 0 6px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--discret);
      }
      #debug .ligne {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 10px;
      }
      #debug .source {
        font-weight: 700;
        letter-spacing: 0.06em;
        font-size: 15px;
      }
      #debug .source.direct {
        color: #ff4d4d;
      }
      #debug .source.veille {
        color: var(--alerte);
      }
      #debug .discret {
        color: var(--discret);
      }
      #debug .mode {
        color: #000;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        border-radius: 6px;
        padding: 3px 10px;
      }
      #debug .pastilles {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      #debug .p {
        border: 1px solid var(--discret);
        border-radius: 999px;
        padding: 2px 10px 2px 8px;
      }
      #debug .p.on {
        background: var(--texte);
        color: #000;
        border-color: var(--texte);
        font-weight: 600;
      }
      #debug .p.off {
        color: var(--discret);
        border-style: dashed;
        text-decoration: line-through;
      }
      #debug .p.info {
        border-style: solid;
      }
      #debug .lien {
        border-left: 3px solid var(--ok);
        padding: 2px 0 2px 10px;
      }
      #debug .compte {
        font-variant-numeric: tabular-nums;
        font-weight: 700;
      }
      #debug .carte {
        border: 1px solid var(--trait);
        border-radius: 6px;
        padding: 8px 10px;
        margin-bottom: 6px;
      }
      #debug .carte .tete {
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      #debug .num {
        font-weight: 700;
        font-size: 15px;
        background: var(--texte);
        color: #000;
        border-radius: 4px;
        min-width: 22px;
        text-align: center;
        padding: 0 4px;
      }
      #debug .nom {
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      #debug .barre {
        height: 6px;
        background: var(--trait);
        border-radius: 3px;
        margin: 6px 0 4px;
        overflow: hidden;
      }
      #debug .barre i {
        display: block;
        height: 100%;
        background: var(--texte);
      }
      #debug .meta {
        color: var(--discret);
        font-variant-numeric: tabular-nums;
      }
      #debug .paire {
        border: 1px solid var(--trait);
        border-left: 4px solid var(--ok);
        border-radius: 6px;
        padding: 6px 10px;
        margin-bottom: 6px;
      }
      #debug .paire.rien {
        border-color: var(--alerte);
        border-left-color: var(--alerte);
        background: rgba(255, 159, 69, 0.14);
      }
      #debug .paire .qui {
        overflow-wrap: anywhere;
      }
      #debug .paire .alerte {
        color: var(--alerte);
        font-weight: 700;
        letter-spacing: 0.06em;
      }
      #debug .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 6px;
      }
      #debug .t {
        font:
          12px/1.3 ui-monospace,
          'Cascadia Mono',
          Consolas,
          monospace;
        border: 1px solid var(--trait);
        border-radius: 4px;
        padding: 1px 6px;
        color: var(--discret);
        overflow-wrap: anywhere;
      }
      #debug .t.commun {
        background: var(--ok);
        border-color: var(--ok);
        color: #000;
        font-weight: 700;
      }
      #debug .vide {
        color: var(--discret);
        font-style: italic;
      }
      #debug .barre.fin i {
        background: var(--alerte);
      }
      #debug .temps {
        display: flex;
        justify-content: space-between;
        font-variant-numeric: tabular-nums;
      }
      #debug .bande {
        display: grid;
        grid-template-columns: 64px repeat(64, 1fr);
        gap: 3px 0;
        margin-top: 8px;
        font:
          10px/1 system-ui,
          sans-serif;
        color: var(--discret);
      }
      #debug .bande .lab {
        grid-column: 1;
        align-self: center;
        white-space: nowrap;
      }
      #debug .bande .c {
        height: 11px;
      }
      #debug .bande .c.m {
        border-left: 1px solid var(--trait);
      }
      #debug .bande .k1 {
        background: var(--texte);
      }
      #debug .bande .k0 {
        background: rgba(242, 242, 242, 0.08);
      }
      #debug .bande .drop {
        background: var(--drop);
      }
      #debug .bande .break {
        background: var(--break);
      }
      #debug .bande .niv {
        height: 22px;
        position: relative;
      }
      #debug .bande .niv i {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 1px;
        background: var(--ok);
      }
      #debug .bande .niv b {
        position: absolute;
        left: 0;
        right: 0;
        height: 1px;
        background: var(--texte);
      }
      #debug .bande .num {
        grid-row: 1;
        font-size: 9px;
        min-width: 0;
        padding: 0;
        background: none;
        color: var(--discret);
        font-weight: 400;
        text-align: left;
      }
      #debug .raison {
        border-left: 3px solid var(--texte);
        padding: 2px 0 2px 8px;
        margin-top: 8px;
      }
      #debug .dbg-tete {
        position: sticky;
        top: -12px;
        z-index: 1;
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin: -12px -12px 12px;
        padding: 10px 12px;
        background: rgb(8, 10, 16);
        border-bottom: 1px solid var(--trait);
        border-radius: 8px 8px 0 0;
      }
      #debug .dbg-tete {
        flex-wrap: wrap;
      }
      #debug .dbg-qui {
        flex: 1 1 100%;
        min-width: 0;
      }
      #debug .dbg-pied {
        margin-top: 14px;
        padding-top: 8px;
        border-top: 1px solid var(--trait);
      }
      #debug .dbg-vhs {
        background: none;
        border: 0;
        padding: 0;
        font: inherit;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.4);
        cursor: pointer;
      }
      #debug .dbg-vhs:hover,
      #debug .dbg-vhs[aria-pressed='true'] {
        color: rgba(255, 255, 255, 0.85);
      }
      #debug .dbg-age {
        margin-left: 8px;
        font-variant-numeric: tabular-nums;
      }
      #debug .dbg-chaine {
        margin-top: 2px;
        color: var(--discret);
        font-size: 12px;
        letter-spacing: 0.04em;
      }
      #debug .dbg-bouton-expert {
        flex: none;
        min-height: 32px;
        padding: 0 14px;
        cursor: pointer;
        font:
          600 12px/1 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--texte);
        background: transparent;
        border: 1px solid var(--discret);
        border-radius: 999px;
      }
      #debug .dbg-bouton-expert[aria-pressed='true'] {
        background: var(--texte);
        color: #000;
        border-color: var(--texte);
      }
      #debug .dbg-bouton-expert:focus-visible {
        outline: 2px solid var(--texte);
        outline-offset: 2px;
      }
      #debug a.dbg-doc {
        display: inline-flex;
        align-items: center;
        text-decoration: none;
      }
      #debug h3.dbg-h3-image {
        display: flex;
        align-items: center;
      }
      #debug .dbg-bouton-image {
        margin-left: auto;
        padding: 4px 8px;
        cursor: pointer;
        font:
          500 13px/1 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        letter-spacing: 0;
        text-transform: none;
        color: var(--texte);
        background: transparent;
        border: 0;
        border-radius: 6px;
      }
      #debug .dbg-bouton-image[aria-pressed='false'] {
        color: var(--discret);
      }
      #debug .dbg-bouton-image::before {
        content: '';
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 6px;
        border-radius: 50%;
        border: 1px solid var(--discret);
      }
      #debug .dbg-bouton-image[aria-pressed='true']::before {
        background: var(--texte);
        border-color: var(--texte);
      }
      #debug .dbg-bouton-image:focus-visible {
        outline: 2px solid var(--texte);
        outline-offset: 2px;
      }
      #debug .dbg-faders {
        display: grid;
        gap: 10px;
        margin: 4px 0 12px;
      }
      #debug .dbg-faders.eteint {
        opacity: 0.45;
      }
      #debug .dbg-fader-loop .nom {
        font-size: 12px;
        color: var(--discret);
        margin-bottom: 4px;
      }
      #debug .dbg-fader-loop.wiggle .nom::after {
        content: ' · wiggle';
        color: var(--texte);
      }
      #debug .dbg-fader {
        display: grid;
        grid-template-columns: 76px 1fr 48px;
        align-items: center;
        gap: 8px;
        height: 18px;
        font-size: 12px;
      }
      #debug .dbg-fader .rail {
        position: relative;
        height: 4px;
        background: rgba(242, 242, 242, 0.14);
        border-radius: 2px;
      }
      #debug .dbg-fader .rail::before {
        content: '';
        position: absolute;
        left: 50%;
        top: -3px;
        bottom: -3px;
        width: 1px;
        background: var(--discret);
      }
      #debug .dbg-fader .rail i {
        position: absolute;
        top: 0;
        bottom: 0;
        background: var(--texte);
        border-radius: 2px;
        transition:
          left 120ms linear,
          width 120ms linear;
      }
      #debug .dbg-fader .rail b {
        position: absolute;
        top: 50%;
        width: 10px;
        height: 10px;
        margin: -5px 0 0 -5px;
        border-radius: 50%;
        background: var(--texte);
        transition: left 120ms linear;
      }
      #debug .dbg-fader:not(.bouge) .rail b {
        background: var(--discret);
      }
      #debug .dbg-fader .v {
        text-align: right;
        font-variant-numeric: tabular-nums;
        color: var(--discret);
      }
      #debug .dbg-fader.bouge .v {
        color: var(--texte);
      }
      #debug h3 .etape {
        display: inline-grid;
        place-items: center;
        width: 18px;
        height: 18px;
        margin-right: 8px;
        border-radius: 4px;
        background: var(--texte);
        color: #000;
        letter-spacing: 0;
        font-weight: 700;
      }
      #debug .dbg-silence {
        margin-bottom: 10px;
        padding: 8px 10px;
        border: 2px solid var(--alerte);
        border-radius: 6px;
        background: rgba(255, 159, 69, 0.16);
        color: var(--alerte);
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      #debug .dbg-silence::before {
        content: '▲ ';
      }
      #debug .dbg-entendu.muet .dbg-grille,
      #debug .dbg-entendu.muet .dbg-spectre {
        opacity: 0.35;
      }
      #debug .dbg-pouls {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
      }
      #debug .dbg-kick {
        flex: none;
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        border-radius: 6px;
        border: 1px solid var(--discret);
        background: rgba(242, 242, 242, 0.08);
        color: var(--discret);
        font:
          700 12px/1 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        transition:
          background 0.18s,
          color 0.18s,
          box-shadow 0.18s;
      }
      #debug .dbg-kick.bat {
        background: #fff;
        color: #000;
        border-color: #fff;
        box-shadow: 0 0 18px 4px rgba(255, 255, 255, 0.7);
        transition: none;
      }
      #debug .dbg-infos {
        min-width: 0;
        overflow-wrap: anywhere;
        font:
          13px/1.4 ui-monospace,
          'Cascadia Mono',
          Consolas,
          monospace;
        font-variant-numeric: tabular-nums;
      }
      #debug .dbg-grille {
        display: grid;
        grid-template-columns: 76px repeat(16, minmax(0, 1fr));
        gap: 3px;
        align-items: center;
        font:
          12px/1 ui-monospace,
          'Cascadia Mono',
          Consolas,
          monospace;
      }
      #debug .dbg-grille .lab {
        color: var(--discret);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        white-space: nowrap;
      }
      #debug .dbg-grille .tn {
        grid-column: span 4;
        padding: 0 0 2px 2px;
        color: var(--discret);
      }

    </div>
    <script type="module">
      import { MontageSeul, enCommun, tagsDe } from './montage.js';
      import { index, plan, enDirect } from './miroir.js';
      import { reglages as reglagesImage, creeWiggle, applique, filtre } from './image.js';
      import { lireReglages } from './reglages.js';
      import { parametreSur, estLocalHote, adresseSure } from './adresses.js';
      import { vhsPossible } from './vhs.js';
      import { creerTrails } from './trails.js';
      const q = new URLSearchParams(location.search);
      const config = await fetch('config.json', { cache: 'no-store' })
        .then((r) => (r.ok ? r.json() : {}))
        .catch(() => ({}));
      const ADRESSES = new Set(['manifest', 'medias']);
      const reglage = (cle2, defaut) =>
        (ADRESSES.has(cle2) ? parametreSur(q, cle2, [config.medias]) : q.get(cle2)) ?? config[cle2] ?? defaut;
      const base = reglage('manifest', 'manifest.json');
      const racine = new URL('.', new URL(base, location.href)).href;
      const dansCadre = document.documentElement.classList.contains('dans-cadre');
      const canalDoc =
        !dansCadre && 'BroadcastChannel' in window ? new BroadcastChannel('aftertv-doc') : null;
      let docVue = 0;
      if (canalDoc)
        canalDoc.onmessage = (m) => {
          if (m.data && m.data.t === 'hello') docVue = Date.now();
        };
      function versDoc(msg) {
        if (!canalDoc || Date.now() - docVue > 1e4) return;
        try {
          canalDoc.postMessage({ ...msg, ts: Date.now() });
        } catch {}
      }
      const directBrut = q.get('direct');
      const paramDirect =
        directBrut === null || directBrut === '' || directBrut === '1' || estLocalHote(location.hostname)
          ? directBrut
          : (adresseSure(directBrut, [location.origin, config.direct], location.href) ?? '1');
      const suitDashboard = !!config.pilote || dansCadre || paramDirect !== null;
      const adresseRelais = paramDirect === '1' ? config.direct || null : paramDirect || null;
      const visiteur = dansCadre ? null : lireReglages();
      const moodVisiteur = (s) =>
        ['house', 'techno', 'tout'].includes(s) ? s : s === 'auto' ? 'tout' : 'house';
      let mood = reglage('mood', null) ?? (visiteur ? moodVisiteur(visiteur.style) : 'tout');
      const bpm = Number(reglage('bpm', 126)) || 126;
      let montage = null;
      const medias = reglage('medias');
      const baseMedias = medias ? new URL(medias, location.href).href : racine;
      const lirePixels = vhsPossible(baseMedias);
      const url = (rel) => new URL(rel, baseMedias).href;
      function finAttente() {
        document.getElementById('depart').hidden = true;
        document.getElementById('vignette').style.backgroundImage = 'none';
      }
      const NOMS_MODES = {
        drop: 'Drop',
        break: 'Break',
        suspension: 'Suspension',
        hyper: 'Hyper',
        one_shot: 'One shot',
      };
      const nomFamille = (f) => f.charAt(0).toUpperCase() + f.slice(1);
      function indique(mode, style, tempo, familles, repli) {
        const m = document.getElementById('mode');
        m.textContent = NOMS_MODES[mode] || '';
        m.style.background = mode ? `var(--${mode}, #f2f2f2)` : '';
        document.getElementById('style').textContent =
          familles && familles.length
            ? familles.map(nomFamille).join(' · ') + (repli && repli.includes('montage') ? ' (repli)' : '')
            : style === 'house'
              ? 'House'
              : style === 'techno'
                ? 'Techno'
                : style === 'les deux'
                  ? 'House · Techno'
                  : style === 'tout'
                    ? 'Tous styles'
                    : '';
        document.getElementById('tempo').textContent =
          tempo === 'mesure' ? 'tempo en mesure' : tempo ? `${Math.round(tempo)} BPM` : '';
      }
      const finBat = {};
      function bat(id) {
        if (id === 'kick' && document.body.classList.contains('trou')) document.body.classList.remove('trou');
        if (id === 'kick') wiggleSurKick();
        consoleBat(id);
        versDoc({ t: 'bat', id });
        const v = document.getElementById(id);
        if (!v) return;
        v.classList.add('bat');
        clearTimeout(finBat[id]);
        finBat[id] = setTimeout(() => v.classList.remove('bat'), 70);
      }
      const PULSE_MARGE_S = 1.6;
      const pulseVu = { kicks: 0, temps: 0 };
      let pulseRetard = Infinity,
        kicksDirects = false;
      function pulse(p) {
        if (kicksDirects || !p) return;
        document.body.classList.add('kicks');
        const maintenant = Date.now() / 1e3;
        for (const [cle2, id] of [
          ['kicks', 'kick'],
          ['temps', 'bpm'],
        ]) {
          for (const t of p[cle2] || []) {
            if (!(t > pulseVu[cle2])) continue;
            pulseVu[cle2] = t;
            pulseRetard = Math.min(pulseRetard, maintenant - t);
            const dans = t + pulseRetard + PULSE_MARGE_S - maintenant;
            if (dans > -0.2) setTimeout(() => bat(id), Math.max(0, dans * 1e3));
          }
        }
      }
      function ouvreKicks(hote) {
        let ws;
        try {
          ws = new WebSocket(`ws://${hote}/kicks`);
        } catch {
          return;
        }
        ws.onopen = () => {
          kicksDirects = true;
          document.body.classList.add('kicks');
        };
        ws.onmessage = (m) => {
          let d;
          try {
            d = JSON.parse(m.data);
          } catch {
            return;
          }
          if (d.kick > 0) bat('kick');
          if (d.temps > 0) bat('bpm');
        };
        ws.onclose = () => {
          kicksDirects = false;
          setTimeout(() => ouvreKicks(hote), 5e3);
        };
      }
      let pilote = null;
      function ouvrePilote() {
        pilote = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
        pilote.onopen = () => document.body.classList.add('pilote');
        pilote.onclose = () => {
          document.body.classList.remove('pilote');
          setTimeout(ouvrePilote, 3e3);
        };
        pilote.onmessage = null;
      }
      if (config.pilote) {
        ouvrePilote();
        ouvreKicks(location.host);
      } else if (q.has('debug') && suitDashboard) ouvreKicks('127.0.0.1:8765');
      function choisisMood(m) {
        const direct2 = suitDashboard && document.body.classList.contains('direct');
        if (direct2 && pilote?.readyState === 1) pilote.send(JSON.stringify({ kind: 'mood', value: m }));
        else if (direct2 && relaisWs?.readyState === 1)
          relaisWs.send(JSON.stringify({ kind: 'mood', value: m }));
        else changeMood(m);
      }
      function montreMood(m) {
        document
          .querySelectorAll('[data-mood]')
          .forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mood === m)));
      }
      function montreEcoute(e) {
        const son = e.son || {},
          mu = e.musique || {};
        const entend = son.alerte
          ? 'pas de son'
          : son.lecture || son.section
            ? `entend ${son.lecture || son.section}`
            : '';
        const auSon = mu.style_son ? mu.style_son.style : null;
        const style = mu.style_lu
          ? `style lu ${mu.style_lu}`
          : auSon
            ? `style au son ${auSon}`
            : mu.genres && mu.genres.length
              ? `style ? (${mu.genres.join(', ')})`
              : mu.ecoute
                ? 'style pas encore lu'
                : '';
        const titre = titreDe(e)
          ? titreDe(e)
          : mu.ecoute
            ? `titre pas encore reconnu (${mu.requetes || 0} essai${mu.requetes > 1 ? 's' : ''})`
            : '';
        document.getElementById('ecoute').textContent = [entend, style, titre].filter(Boolean).join(' · ');
      }
      let morceauA = null,
        decalageMin = Infinity;
      function avancement(m) {
        if (!m || m.position_s == null || m.a == null) return null;
        if (m.a !== morceauA) {
          morceauA = m.a;
          decalageMin = Math.min(decalageMin, Date.now() / 1e3 - m.a);
        }
        let pos = Math.max(0, m.position_s + (Date.now() / 1e3 - m.a - decalageMin) * (m.vitesse || 1));
        const duree = m.duree_s || null;
        if (duree) pos = Math.min(pos, duree);
        return { pos, duree, reste: duree ? duree - pos : null, fin: duree ? duree - pos < 30 : false };
      }
      const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
      function montreAvance() {
        const el = document.getElementById('avance'),
          a = avancement(dernierEtat && dernierEtat.morceau);
        el.classList.toggle('la', !!a);
        if (!a) return;
        el.classList.toggle('fin', a.fin);
        el.querySelector('.rail').style.display = a.duree ? '' : 'none';
        el.querySelector('.rail i').style.width = a.duree ? `${(a.pos / a.duree) * 100}%` : '0';
        el.querySelector('time').textContent = a.duree
          ? `${mmss(a.pos)} / ${mmss(a.duree)} · −${mmss(a.reste)}`
          : mmss(a.pos);
      }
      setInterval(montreAvance, 500);
      const titreDe = (e) =>
        e.artiste && e.titre
          ? `${e.artiste} — ${e.titre}${e.morceau && e.morceau.confiance === 'à confirmer' ? ' ?' : ''}`
          : '';
      function changeMood(m) {
        mood = m;
        montage?.setMood(mood);
        document
          .querySelectorAll('[data-mood]')
          .forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mood === mood)));
      }
      async function lisStyle() {
        try {
          const s = await (await fetch(url(reglage('style')), { cache: 'no-store' })).json();
          if (s.mood && s.mood !== mood) changeMood(s.mood === 'les deux' ? 'tout' : s.mood);
          montage?.setFamilles(s.familles || []);
          if (direct())
            document.getElementById('titre').textContent =
              s.artiste && s.titre ? `${s.artiste} — ${s.titre}` : '';
        } catch {}
      }
      let idx = index([]),
        dernierRecu = null;
      const couches = new Map();
      const direct = () => suitDashboard && enDirect(dernierRecu, Date.now());
      function couche(n) {
        if (!couches.has(n)) {
          const div = document.createElement('div');
          div.className = 'couche';
          div.style.zIndex = String(n);
          const videos = [0, 1].map(() => {
            const v = document.createElement('video');
            Object.assign(v, { muted: true, playsInline: true, loop: true, preload: 'auto' });
            if (lirePixels) v.crossOrigin = 'anonymous';
            v.setAttribute('muted', '');
            v.setAttribute('playsinline', '');
            div.appendChild(v);
            return v;
          });
          document.getElementById('miroir').appendChild(div);
          couches.set(n, { div, videos, actif: 0, id: null, t: null });
        }
        return couches.get(n);
      }
      const lecture = {
        bascules: 0,
        attente_ms: 0,
        relances: 0,
        abandons: 0,
        en_attente: 0,
        noirs_evites: 0,
        hd_absents: 0,
      };
      const ATTENTE_MAX_MS = 8e3;
      function enMemoire(v, t) {
        for (let i = 0; i < v.buffered.length; i++)
          if (t >= v.buffered.start(i) && t < v.buffered.end(i) - 0.3) return true;
        return false;
      }
      function quandImagePrete(v, fait, rate) {
        const debut = performance.now();
        let fini = false;
        const fin = (f) => {
          if (!fini) {
            fini = true;
            clearInterval(veille);
            f(performance.now() - debut);
          }
